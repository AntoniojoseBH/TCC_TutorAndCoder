# Infraestrutura de desenvolvimento do TutorAndCoder.
#   docker compose up -d postgres redis

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: senha         
      POSTGRES_DB: tutoria
    ports:
      - "127.0.0.1:5432:5432"          
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutoria"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tutor:senha@postgres:5432/tutoria
      REDIS_URL: redis://redis:6379/0
      PROJECTS_ROOT: /app/student_projects
    volumes:
      - .:/app
      - projects_data:/app/student_projects  
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  projects_data:
